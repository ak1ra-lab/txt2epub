[project]
name = "txt2epub-cli"
dynamic = ["version"]
description = "Auditable Chinese TXT to EPUB 3 converter with multi-level TOC"
authors = [{ name = "ak1ra", email = "git@ak1ra.xyz" }]
dependencies = [
    "argcomplete>=3.7.2",
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]
keywords = ["epub", "txt", "chinese", "ebook", "koreader"]
readme = { file = "README.md", content-type = "text/markdown" }
license = "GPL-3.0-only"

[project.urls]
Homepage = "https://github.com/ak1ra-lab/txt2epub"
Documentation = "https://ak1ra-lab.github.io/txt2epub/"
Repository = "https://github.com/ak1ra-lab/txt2epub"
Issues = "https://github.com/ak1ra-lab/txt2epub/issues"
Changelog = "https://github.com/ak1ra-lab/txt2epub/blob/main/CHANGELOG.md"

[project.scripts]
txt2epub = "txt2epub_cli.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/txt2epub_cli"]

[dependency-groups]
tests = ["pytest>=9.2.0", "pytest-cov>=7.1.0"]
lint = ["ruff>=0.17.5", "ty>=0.0.105"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.8.1",
    "mkdocs-static-i18n>=1.3.1",
]
dev = [
    { include-group = "tests" },
    { include-group = "lint" },
    { include-group = "docs" },
    "pre-commit>=4.7.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "local: tests that need examples/ and TXT2EPUB_LOCAL_SAMPLES=1",
]
