---
name: publish-to-pypi

on:
  workflow_dispatch: ~
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-n-push:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/txt2epub-cli/

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install the project
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest -v tests/

      - name: Build a binary wheel and a source tarball
        run: uv build -v

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
